# AUTOPLACEHOLDER_ANNOTATION: render.yaml
# Purpose: File in render.yaml area for project orchestration/configuration/data.
# Area: A repository component with localized responsibility
# System effect: Change can influence a repository component with localized responsibility and therefore affects build/runtime behavior indirectly.
services:
  - type: web
    name: openclaw
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: SETUP_PASSWORD
        sync: false
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
